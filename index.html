<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Scorer Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0c;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: white;
            margin: 0;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #16a34a; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <!-- Dependencias -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        // Componente para Iconos de Lucide
        const Icon = ({ name, className, size = 24 }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current && lucide.icons[name]) {
                    ref.current.innerHTML = lucide.icons[name].toSvg({
                        class: className,
                        width: size,
                        height: size
                    });
                }
            }, [name, className, size]);
            return <span ref={ref} className="inline-block leading-none" />;
        };

        const STADIUMS = [
            { id: 'default', name: 'Predeterminado', url: 'https://i.ibb.co/m5VmNDHP/concepto-hacer-deporte-23-2151937746-1.jpg', category: 'General' },
            { id: 'messi', name: 'Messi', url: 'https://i.ibb.co/GfRRRzxn/wp12392314.png', category: 'Futbolistas' },
            { id: 'monumental1', name: 'Mâs Monumental', url: 'https://i.ibb.co/0pK28kyy/Screenshot-20260327-004333-Google-1.jpg', category: 'LPF' },
            { id: 'monumental2', name: 'Mâs Monumental (foto 2)', url: 'https://i.ibb.co/7t5twpNg/HD-wallpaper-river-el-monumental-river-plate.jpg', category: 'LPF' },
            { id: 'bombonera', name: 'Bombonera', url: 'https://i.ibb.co/7xNwgCfm/9504e79e249033d4d04e227a622f89df.jpg', category: 'LPF' },
            { id: 'libertadores', name: 'Libertadores de América', url: 'https://i.ibb.co/HLhNvtJc/f919f8f8a600110daa86016c8d8e39c6.jpg', category: 'LPF' },
            { id: 'cilindro', name: 'Cilindro de Avellaneda', url: 'https://i.ibb.co/Mxmn1bt7/8c0613d8dd1432fee122287be21a2fff.jpg', category: 'LPF' },
            { id: 'gasometro', name: 'El Gasómetro', url: 'https://i.ibb.co/p6f57pfG/82084278f79cff23617f50a45a4afb14.jpg', category: 'LPF' },
            { id: 'neoquimica', name: 'Neo Química Arena', url: 'https://i.ibb.co/yBWbpMPh/962564b5eeea4f0da4f26b898b1e0325.jpg', category: 'Brasileirão' },
            { id: 'allianz', name: 'Allianz Parque', url: 'https://i.ibb.co/8nCLp4BD/66b8da8ebdbd647c76497a0a20ff30d0.jpg', category: 'Brasileirão' },
            { id: 'morumbis', name: 'Morumbis', url: 'https://i.ibb.co/rG1QKfpB/a8317f6d199347a079ededa55d9f39b6.jpg', category: 'Brasileirão' },
            { id: 'campnou', name: 'Camp Nou', url: 'https://i.ibb.co/39nSr3QF/8b6ac40ce6862da956c40fffc9bd454a.jpg', category: 'La Liga' },
            { id: 'bernabeu', name: 'Santiago Bernabéu', url: 'https://i.ibb.co/nMMshX5T/66d0d2d25a8941f58853fdf690592b59.jpg', category: 'La Liga' },
            { id: 'metropolitano', name: 'Metropolitano', url: 'https://i.ibb.co/GvndxYFG/f65212658964e531f7d6f4a4a2331712.jpg', category: 'La Liga' },
            { id: 'psg', name: 'PSG', url: 'https://i.ibb.co/BbhD1L9/401f894d753b4a9faaf78f8481aecedc.jpg', category: 'Ligue 1' },
            { id: 'franchi', name: 'Stadio Artemio Franchi', url: 'https://i.ibb.co/QFcGpGnq/HD-wallpaper-stadio-artemio-franchi-acf-fiorentina-stadium-florence-italy-sports-arena-fans-italian.jpg', category: 'Serie A' },
            { id: 'sansiro', name: 'San Siro', url: 'https://i.ibb.co/PbVtWYM/198412180c7bcb6567fe91fc5949864c.jpg', category: 'Serie A' },
            { id: 'torino', name: 'Stadio Olimpico Grande Torino', url: 'https://i.ibb.co/hJM9pFWC/general-view-stadio-olimpico-grande-torino-during-440nw-13074022ak-1.jpg', category: 'Serie A' },
            { id: 'bayern', name: 'Bayern Múnich', url: 'https://i.ibb.co/60G9014h/3e7227d504ea883430ddfc75f21926f6.jpg', category: 'Bundesliga' },
            { id: 'dortmund', name: 'Borussia Dortmund', url: 'https://i.ibb.co/84nF6dWM/HD-wallpaper-at-signal-iduna-park-borussia-dortmund-stadium.jpg', category: 'Bundesliga' },
            { id: 'leverkusen', name: 'Bayer 04 Leverkusen', url: 'https://i.ibb.co/yJ3Jc3f/poster.jpg', category: 'Bundesliga' },
            { id: 'mancity', name: 'Manchester City', url: 'https://i.ibb.co/9Hckp5Sh/46590e615b1d227322132dd4f018d975.jpg', category: 'Premier League' },
            { id: 'arsenal', name: 'Arsenal', url: 'https://i.ibb.co/vCspY0X5/bf6c1d428a5391f5da214387e48ef6dc.jpg', category: 'Premier League' },
            { id: 'chelsea', name: 'Chelsea', url: 'https://i.ibb.co/ksysfgyz/c30aed75acb6968e103e05044fd6e273.jpg', category: 'Premier League' },
            { id: 'intermiami', name: 'Inter Miami', url: 'https://i.ibb.co/KjMxsZHL/FUTBOL-MESSI-INTER-PARTIDO-scaled-e1690304081152-1.jpg', category: 'MLS' },
            { id: 'sounders', name: 'Seattle Sounders', url: 'https://i.ibb.co/xSktLVN1/41d87e429d4a30f22a6cf64b36f5b66b.jpg', category: 'MLS' },
            { id: 'lafc', name: 'Los Ángeles FC', url: 'https://i.ibb.co/sJjW4m7L/Screenshot-20260327-010744-Google-1.jpg', category: 'MLS' },
            { id: 'azteca', name: 'Estadio Azteca', url: 'https://i.ibb.co/ynjzH73p/e5ea5364.jpg', category: 'Liga MX' },
        ];

        function App() {
            const [view, setView] = useState(() => localStorage.getItem('fc-view') || 'selector');
            const [background, setBackground] = useState(() => localStorage.getItem('fc-background') || STADIUMS[0].url);
            const [title, setTitle] = useState(() => localStorage.getItem('fc-scorer-title') || 'Temporada Febrero-Marzo');
            const [players, setPlayers] = useState(() => {
                const saved = localStorage.getItem('fc-scorer-players');
                return saved ? JSON.parse(saved) : [];
            });
            const [newPlayerName, setNewPlayerName] = useState('');
            const [isEditingTitle, setIsEditingTitle] = useState(false);
            const [showResetConfirm, setShowResetConfirm] = useState(false);
            const [activeCategory, setActiveCategory] = useState('Todas');
            const titleInputRef = useRef(null);

            const categories = ['Todas', ...Array.from(new Set(STADIUMS.map(s => s.category)))];
            const filteredStadiums = activeCategory === 'Todas' ? STADIUMS : STADIUMS.filter(s => s.category === activeCategory);

            useEffect(() => { localStorage.setItem('fc-view', view); }, [view]);
            useEffect(() => { localStorage.setItem('fc-background', background); }, [background]);
            useEffect(() => { localStorage.setItem('fc-scorer-title', title); }, [title]);
            useEffect(() => { localStorage.setItem('fc-scorer-players', JSON.stringify(players)); }, [players]);

            useEffect(() => {
                if (isEditingTitle && titleInputRef.current) titleInputRef.current.focus();
            }, [isEditingTitle]);

            const selectStadium = (url) => { setBackground(url); setView('tracker'); };
            const addPlayer = (e) => {
                e.preventDefault();
                if (!newPlayerName.trim()) return;
                setPlayers([...players, { id: Date.now().toString(), name: newPlayerName.trim(), goals: 0 }]);
                setNewPlayerName('');
            };
            const incrementGoals = (id) => {
                setPlayers(prev => prev.map(p => p.id === id ? { ...p, goals: p.goals + 1 } : p));
            };
            const resetGoals = () => { setPlayers(prev => prev.map(p => ({ ...p, goals: 0 }))); setShowResetConfirm(false); };
            const removePlayer = (id) => { setPlayers(prev => prev.filter(p => p.id !== id)); };
            const sortedPlayers = [...players].sort((a, b) => b.goals - a.goals);

            if (view === 'selector') {
                return (
                    <div className="min-h-screen bg-[#0a0a0c] bg-[radial-gradient(circle_at_center,rgba(34,197,94,0.05),transparent)] text-white font-sans p-4 flex flex-col items-center">
                        <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} className="max-w-5xl w-full mt-8">
                            <header className="text-center mb-8">
                                <Icon name="Trophy" className="text-yellow-500 mx-auto mb-3" size={40} />
                                <h1 className="text-2xl font-black tracking-tighter uppercase italic">Selector de Estadios</h1>
                                <p className="text-white/40 text-xs mt-1">Elige el escenario para tu tabla de goleadores</p>
                            </header>
                            <div className="flex flex-wrap justify-center gap-2 mb-8 overflow-x-auto pb-2 scrollbar-hide">
                                {categories.map(cat => (
                                    <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest transition-all border ${activeCategory === cat ? 'bg-green-600 border-green-500 text-white' : 'bg-white/5 border-white/10 text-white/40 hover:text-white hover:bg-white/10'}`}>
                                        {cat}
                                    </button>
                                ))}
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 mb-10 max-h-[60vh] overflow-y-auto p-2">
                                {filteredStadiums.map((stadium) => (
                                    <button key={stadium.id} onClick={() => selectStadium(stadium.url)} className="group relative aspect-video rounded-lg overflow-hidden border border-white/10 hover:border-green-500/50 transition-all text-left">
                                        <img src={stadium.url} alt={stadium.name} className="absolute inset-0 w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-110 transition-all duration-500" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent" />
                                        <div className="absolute bottom-2 left-2 right-2 flex flex-col">
                                            <span className="text-[8px] font-black uppercase tracking-widest text-green-500 mb-0.5">{stadium.category}</span>
                                            <span className="text-[10px] font-bold uppercase italic tracking-tight leading-tight truncate">{stadium.name}</span>
                                        </div>
                                    </button>
                                ))}
                            </div>
                            <div className="flex justify-center pb-8">
                                <button onClick={() => selectStadium(STADIUMS[0].url)} className="px-10 py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full text-[10px] font-black uppercase tracking-widest transition-all active:scale-95 flex items-center gap-2">
                                    Omitir y usar predeterminado
                                    <Icon name="ChevronRight" size={16} />
                                </button>
                            </div>
                        </motion.div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-cover bg-center bg-no-repeat text-white font-sans selection:bg-green-500/30" style={{ backgroundImage: `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url(${background})` }}>
                    <main className="max-w-3xl mx-auto px-2 py-4">
                        <header className="flex items-center justify-between mb-4 px-2">
                            <div className="flex items-center gap-3">
                                {isEditingTitle ? (
                                    <input ref={titleInputRef} type="text" value={title} onChange={(e) => setTitle(e.target.value)} onBlur={() => setIsEditingTitle(false)} onKeyDown={(e) => e.key === 'Enter' && setIsEditingTitle(false)} className="text-lg font-black bg-transparent border-b border-green-500 outline-none italic uppercase" />
                                ) : (
                                    <h1 onClick={() => setIsEditingTitle(true)} className="text-lg font-black cursor-pointer hover:text-green-400 transition-colors italic uppercase tracking-tight">{title}</h1>
                                )}
                            </div>
                            <button onClick={() => setView('selector')} className="p-2 hover:bg-white/10 rounded-lg transition-colors text-white/40 hover:text-white" title="Cambiar Estadio">
                                <Icon name="Settings" size={16} />
                            </button>
                        </header>
                        <section className="mb-4 px-2">
                            <form onSubmit={addPlayer} className="flex gap-1">
                                <input type="text" placeholder="Nuevo jugador..." value={newPlayerName} onChange={(e) => setNewPlayerName(e.target.value)} className="flex-1 h-8 px-3 text-xs bg-white/5 border border-white/10 rounded-md outline-none focus:border-green-500/50 transition-all" />
                                <button type="submit" className="h-8 px-4 bg-green-600 hover:bg-green-500 text-[10px] font-black uppercase tracking-tighter rounded-md transition-all flex items-center gap-1">
                                    <Icon name="UserPlus" size={12} />
                                    Añadir
                                </button>
                            </form>
                        </section>
                        <section className="bg-black/70 backdrop-blur-md rounded-lg border border-white/5 overflow-hidden">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-white/5 border-b border-white/10">
                                        <th className="py-2 px-3 text-[10px] font-black uppercase tracking-widest text-white/40 w-12 text-center">Pos</th>
                                        <th className="py-2 px-3 text-[10px] font-black uppercase tracking-widest text-white/40">Jugador</th>
                                        <th className="py-2 px-3 text-[10px] font-black uppercase tracking-widest text-white/40 w-20 text-center">Goles</th>
                                        <th className="py-2 px-3 text-[10px] font-black uppercase tracking-widest text-white/40 w-24 text-right">Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <AnimatePresence mode="popLayout">
                                        {sortedPlayers.map((player, index) => (
                                            <motion.tr key={player.id} layout initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className={`border-b border-white/5 hover:bg-white/5 transition-colors ${index === 0 ? 'bg-green-500/5' : ''}`}>
                                                <td className="py-1.5 px-3 text-center">
                                                    <span className={`inline-block w-5 h-5 leading-5 text-[10px] font-black rounded ${index === 0 ? 'bg-yellow-500 text-black' : index === 1 ? 'bg-gray-300 text-black' : index === 2 ? 'bg-orange-600 text-white' : 'bg-white/10 text-white/60'}`}>{index + 1}</span>
                                                </td>
                                                <td className="py-1.5 px-3">
                                                    <span className="text-xs font-bold uppercase tracking-tight block truncate max-w-[200px] sm:max-w-none">{player.name}</span>
                                                </td>
                                                <td className="py-1.5 px-3 text-center">
                                                    <div className="flex items-center justify-center gap-1">
                                                        <Icon name="Target" size={12} className={index === 0 ? 'text-green-400' : 'text-white/20'} />
                                                        <span className="text-xs font-mono font-bold">{player.goals}</span>
                                                    </div>
                                                </td>
                                                <td className="py-1.5 px-3 text-right">
                                                    <div className="flex items-center justify-end gap-1">
                                                        <button onClick={() => incrementGoals(player.id)} className="w-7 h-7 flex items-center justify-center bg-green-600/20 hover:bg-green-600 text-green-400 hover:text-white rounded transition-all active:scale-90"><Icon name="Plus" size={16} /></button>
                                                        <button onClick={() => removePlayer(player.id)} className="w-7 h-7 flex items-center justify-center text-white/10 hover:text-red-500 hover:bg-red-500/10 rounded transition-all"><Icon name="Trash2" size={14} /></button>
                                                    </div>
                                                </td>
                                            </motion.tr>
                                        ))}
                                    </AnimatePresence>
                                </tbody>
                            </table>
                            {players.length === 0 && <div className="py-12 text-center text-[10px] font-black uppercase tracking-widest text-white/20 italic">Sin registros en la base de datos</div>}
                        </section>
                        {players.length > 0 && (
                            <footer className="mt-6 flex flex-col items-center gap-3">
                                {showResetConfirm ? (
                                    <div className="flex items-center gap-3 p-2 rounded-lg bg-red-500/10 border border-red-500/20 backdrop-blur-md">
                                        <span className="text-[10px] font-black uppercase tracking-tighter text-red-400">¿Confirmar reset?</span>
                                        <div className="flex gap-1">
                                            <button onClick={resetGoals} className="px-3 py-1 bg-red-600 hover:bg-red-500 text-white text-[9px] font-black uppercase rounded transition-all">Reset</button>
                                            <button onClick={() => setShowResetConfirm(false)} className="px-3 py-1 bg-white/10 hover:bg-white/20 text-white text-[9px] font-black uppercase rounded transition-all">No</button>
                                        </div>
                                    </div>
                                ) : (
                                    <button onClick={() => setShowResetConfirm(true)} className="flex items-center gap-1.5 px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-white/20 hover:text-red-400 transition-colors">
                                        <Icon name="RotateCcw" size={12} />
                                        Reiniciar Planilla
                                    </button>
                                )}
                            </footer>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
